<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <!-- Gradients for the 9 icons -->
    <linearGradient id="grad0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#72f551"/>
      <stop offset="100%" stop-color="#1ccf07"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd533"/>
      <stop offset="100%" stop-color="#ffa000"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb13a"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    
    <linearGradient id="grad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4f4f"/>
      <stop offset="100%" stop-color="#d30000"/>
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e5eb"/>
      <stop offset="100%" stop-color="#8a95a5"/>
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6685"/>
      <stop offset="100%" stop-color="#ef154b"/>
    </linearGradient>

    <linearGradient id="grad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d16bff"/>
      <stop offset="100%" stop-color="#8e14cc"/>
    </linearGradient>
    <linearGradient id="grad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4db0ff"/>
      <stop offset="100%" stop-color="#0065ff"/>
    </linearGradient>
    <linearGradient id="grad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42e6bc"/>
      <stop offset="100%" stop-color="#00ab7d"/>
    </linearGradient>

    <!-- Background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
  </defs>

  <!-- Base App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad)" filter="url(#shadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="transparent" stroke="#ffffff" stroke-width="4" stroke-opacity="0.8"/>

  <g filter="url(#shadow)">
    <!-- Row 1 -->
    <rect x="110" y="110" width="80" height="80" rx="20" fill="url(#grad0)" />
    <rect x="216" y="110" width="80" height="80" rx="20" fill="url(#grad1)" />
    <rect x="322" y="110" width="80" height="80" rx="20" fill="url(#grad2)" />
    
    <!-- Row 2 -->
    <rect x="110" y="216" width="80" height="80" rx="20" fill="url(#grad3)" />
    <rect x="216" y="216" width="80" height="80" rx="20" fill="url(#grad4)" />
    <rect x="322" y="216" width="80" height="80" rx="20" fill="url(#grad5)" />
    
    <!-- Row 3 -->
    <rect x="110" y="322" width="80" height="80" rx="20" fill="url(#grad6)" />
    <rect x="216" y="322" width="80" height="80" rx="20" fill="url(#grad7)" />
    <rect x="322" y="322" width="80" height="80" rx="20" fill="url(#grad8)" />
  </g>
</svg>

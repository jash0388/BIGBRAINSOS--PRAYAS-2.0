<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#tBg)"/>
  <clipPath id="tclip"><rect width="512" height="512" rx="110"/></clipPath>
  <g clip-path="url(#tclip)">
    <!-- Title bar -->
    <rect x="60" y="90" width="392" height="332" rx="16" fill="#1c1c1e"/>
    <rect x="60" y="90" width="392" height="40" rx="16" fill="#2c2c2e"/>
    <rect x="60" y="112" width="392" height="18" fill="#2c2c2e"/>
    <!-- Traffic lights -->
    <circle cx="100" cy="110" r="8" fill="#FF5F57"/>
    <circle cx="126" cy="110" r="8" fill="#FEBC2E"/>
    <circle cx="152" cy="110" r="8" fill="#28C840"/>
    <!-- Prompt line 1 -->
    <text x="88" y="172" font-family="monospace" font-size="26" fill="#32D74B" font-weight="bold">$ </text>
    <text x="124" y="172" font-family="monospace" font-size="26" fill="#E8E8E8">npm run dev</text>
    <!-- Prompt line 2 -->
    <text x="88" y="212" font-family="monospace" font-size="22" fill="#64D2FF">  ➜ Local:</text>
    <text x="88" y="244" font-family="monospace" font-size="22" fill="#30D158">  http://localhost:5173/</text>
    <!-- Prompt line 3 -->
    <text x="88" y="286" font-family="monospace" font-size="26" fill="#32D74B">$ </text>
    <!-- Cursor blink -->
    <rect x="124" y="271" width="14" height="24" rx="2" fill="#E8E8E8" opacity="0.85"/>
  </g>
</svg>

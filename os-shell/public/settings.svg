<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8e8e93"/>
      <stop offset="100%" stop-color="#48484a"/>
    </radialGradient>
    <radialGradient id="gearGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#sBg)"/>
  <clipPath id="sclip"><rect width="512" height="512" rx="110"/></clipPath>
  <g clip-path="url(#sclip)">
    <!-- Main large gear -->
    <g transform="translate(256,256)">
      <circle r="88" fill="url(#gearGrad)"/>
      <circle r="52" fill="#636366"/>
      <circle r="30" fill="url(#gearGrad)"/>
      <!-- Gear teeth 8x -->
      <rect x="-18" y="-116" width="36" height="40" rx="8" fill="url(#gearGrad)"/>
      <rect x="-18" y="76" width="36" height="40" rx="8" fill="url(#gearGrad)"/>
      <rect x="-116" y="-18" width="40" height="36" rx="8" fill="url(#gearGrad)"/>
      <rect x="76" y="-18" width="40" height="36" rx="8" fill="url(#gearGrad)"/>
      <g transform="rotate(45)">
        <rect x="-18" y="-116" width="36" height="40" rx="8" fill="url(#gearGrad)"/>
        <rect x="-18" y="76" width="36" height="40" rx="8" fill="url(#gearGrad)"/>
        <rect x="-116" y="-18" width="40" height="36" rx="8" fill="url(#gearGrad)"/>
        <rect x="76" y="-18" width="40" height="36" rx="8" fill="url(#gearGrad)"/>
      </g>
    </g>
  </g>
</svg>
